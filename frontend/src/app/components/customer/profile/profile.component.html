<app-navbar></app-navbar>


<div class="profile-page">


  <div
    class="loading"
    *ngIf="loading">

    Loading profile...

  </div>


  <div
    class="profile-container"
    *ngIf="!loading && user">


    <div class="page-header">

      <h1>
        My Profile
      </h1>

      <p>
        Manage your personal information
      </p>

    </div>


    <div class="profile-layout">


      <!-- PROFILE SUMMARY -->

      <div class="profile-card">


        <div class="avatar">

          {{ getInitials() }}

        </div>


        <h2>

          {{ user.name }}

        </h2>


        <p class="profile-email">

          {{ user.email }}

        </p>


        <div class="profile-links">


          <button
            type="button"
            (click)="viewMyBookings()">

            <span>
              🧳
            </span>

            My Bookings

          </button>


          <button
            type="button"
            (click)="viewMyProperties()">

            <span>
              🏠
            </span>

            My Properties

          </button>


        </div>


      </div>


      <!-- PERSONAL INFORMATION -->

      <div class="information-card">


        <div class="information-header">


          <div>

            <h2>
              Personal Information
            </h2>

            <p>
              Update your account details
            </p>

          </div>


          <button
            type="button"
            class="edit-btn"
            *ngIf="!editing"
            (click)="enableEdit()">

            Edit Profile

          </button>


        </div>


        <form
          (ngSubmit)="updateProfile()">


          <div class="form-group">

            <label>
              Full Name
            </label>


            <input
              type="text"
              name="name"
              [(ngModel)]="user.name"
              [disabled]="!editing">

          </div>


          <div class="form-group">

            <label>
              Email Address
            </label>


            <input
              type="email"
              name="email"
              [(ngModel)]="user.email"
              [disabled]="!editing">

          </div>


          <div class="form-group">

            <label>
              Password
            </label>


            <div class="password-box">


              <input
                [type]="
                  showPassword
                  ? 'text'
                  : 'password'
                "
                name="password"
                [(ngModel)]="user.password"
                [disabled]="!editing">


              <button
                type="button"
                class="password-toggle"
                *ngIf="editing"
                (click)="togglePassword()">

                {{
                  showPassword
                  ? 'Hide'
                  : 'Show'
                }}

              </button>


            </div>


          </div>


          <div
            class="form-actions"
            *ngIf="editing">


            <button
              type="button"
              class="cancel-btn"
              (click)="cancelEdit()">

              Cancel

            </button>


            <button
              type="submit"
              class="save-btn"
              [disabled]="updating">

              {{
                updating
                ? 'Saving...'
                : 'Save Changes'
              }}

            </button>


          </div>


        </form>


      </div>


    </div>


  </div>


</div>
