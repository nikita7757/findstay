<app-navbar></app-navbar>

<div class="edit-property-page">


  <div
    class="loading"
    *ngIf="loading">

    Loading property...

  </div>


  <div
    class="edit-container"
    *ngIf="!loading && property">


    <div class="page-header">

      <h1>
        Edit Property
      </h1>

      <p>
        Update your property information
      </p>

    </div>


    <form
      (ngSubmit)="updateProperty()">


      <div class="form-group">

        <label>
          Property Title
        </label>

        <input
          type="text"
          name="title"
          [(ngModel)]="property.title"
          required>

      </div>


      <div class="form-group">

        <label>
          Description
        </label>

        <textarea
          name="description"
          [(ngModel)]="property.description"
          rows="5">

        </textarea>

      </div>


      <div class="form-group">

        <label>
          Location
        </label>

        <input
          type="text"
          name="location"
          [(ngModel)]="property.location"
          required>

      </div>

        <div class="form-group">

  <label>
    Property Category
  </label>

  <select
    name="category"
    [(ngModel)]="selectedCategoryId"
    required>

    <option
      [ngValue]="null"
      disabled>

      Select Property Category

    </option>

    <option
      *ngFor="let category of categories"
      [ngValue]="category.id">

      {{ category.title }}

    </option>

  </select>

</div>
      <div class="form-group">

        <label>
          Price Per Night
        </label>

        <input
          type="number"
          name="pricePerNight"
          [(ngModel)]="property.pricePerNight"
          min="1"
          required>

      </div>


      <div class="form-row">


        <div class="form-group">

          <label>
            Bedrooms
          </label>

          <input
            type="number"
            name="bedrooms"
            [(ngModel)]="property.bedrooms"
            min="1">

        </div>


        <div class="form-group">

          <label>
            Bathrooms
          </label>

          <input
            type="number"
            name="bathrooms"
            [(ngModel)]="property.bathrooms"
            min="1">

        </div>


      </div>


      <div class="availability-box">

        <input
          type="checkbox"
          id="available"
          name="available"
          [(ngModel)]="property.available">

        <label for="available">
          Property is available for booking
        </label>

      </div>

      <!-- PROPERTY IMAGES -->

        <!-- PROPERTY PHOTOS -->

<div class="photos-container">

    <div class="section-heading">
        <h2>Property Photos</h2>

        <p>
            Update photos for each area of your property
        </p>
    </div>


    <div
        class="photo-section"
        *ngFor="
            let section of imageSections;
            let sectionIndex = index
        ">


        <div class="photo-section-header">

            <h3>
                {{ section.sectionName }}
            </h3>


            <button
                type="button"
                class="remove-section-btn"
                (click)="removeSection(section, sectionIndex)">

                Remove Section

            </button>

        </div>


        <!-- EXISTING IMAGE PREVIEW -->

        <div
            class="photo-grid"
            *ngIf="section.images.length > 0">


            <div
                class="photo-preview"
                *ngFor="let image of section.images">


                <img
                    [src]="image.imageUrl"
                    [alt]="section.sectionName">


                <button
                    type="button"
                    class="remove-image-btn"
                    (click)="deleteImage(section, image)">

                    ×

                </button>


                <button
                    type="button"
                    class="edit-photo-btn"
                    (click)="startEditImage(image)">

                    Edit

                </button>


                <!-- EDIT IMAGE URL -->

                <div
                    class="edit-image-url"
                    *ngIf="image.editing">


                    <input
                        type="text"
                        [(ngModel)]="image.editedImageUrl"
                        [name]="'editImage-' + image.id"
                        placeholder="Paste new image URL">


                    <div class="edit-image-actions">

                        <button
                            type="button"
                            (click)="updateImage(image)">

                            Save

                        </button>


                        <button
                            type="button"
                            (click)="cancelEditImage(image)">

                            Cancel

                        </button>

                    </div>

                </div>


            </div>

        </div>


        <!-- ADD NEW IMAGE -->

        <div class="image-add-box">

            <input
                type="text"
                [name]="'imageUrl-' + sectionIndex"
                [(ngModel)]="section.newImageUrl"
                placeholder="Paste image URL">


            <button
                type="button"
                class="add-photo-btn"
                (click)="addImage(section)">

                + Add Photo

            </button>

        </div>

    </div>


    <!-- ADD CUSTOM SECTION -->

    <div class="custom-section-box">

        <div>

            <h3>
                Add Another Area
            </h3>

            <p>
                Example: Balcony, Pool, Garden or Terrace
            </p>

        </div>


        <div class="custom-section-input">

            <input
                type="text"
                name="newSectionName"
                [(ngModel)]="newSectionName"
                placeholder="Enter area name">


            <button
                type="button"
                (click)="addSection()">

                + Add Section

            </button>

        </div>

    </div>

</div>
      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="cancelEdit()">

          Cancel

        </button>


        <button
          type="submit"
          class="update-btn"
          [disabled]="updating">

          {{
            updating
            ? 'Updating...'
            : 'Update Property'
          }}

        </button>

      </div>


    </form>

  </div>

</div>
