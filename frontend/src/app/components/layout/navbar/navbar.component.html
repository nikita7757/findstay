<header class="header">

  <div
    class="logo"
    routerLink="/home">

    <img
      src="assets/appicon.png"
      alt="FindStay Logo">

  </div>


 <nav class="nav-menu">

  <div
    class="nav-item"
    routerLink="/home"
    routerLinkActive="active">

    <i class="fas fa-house"></i>

    <span>
      Home
    </span>

  </div>


  <div
    class="nav-item"
    routerLink="/properties"
    routerLinkActive="active">

    <i class="fas fa-magnifying-glass"></i>

    <span>
      Explore Stays
    </span>

  </div>


  <div
    class="nav-item"
    routerLink="/wishlist"
    routerLinkActive="active">

    <i class="far fa-heart"></i>

    <span>
      Wishlist
    </span>

  </div>


  <div
    class="nav-item"
    routerLink="/my-bookings"
    routerLinkActive="active">

    <i class="far fa-calendar-check"></i>

    <span>
      My Bookings
    </span>

  </div>

</nav>

  <div class="right-menu">

    <a (click)="becomeHost()">

      Become a host

    </a>


      


    <div class="profile-menu-container">

      <button
        class="icon-btn menu-btn"
        type="button"
        (click)="toggleProfileMenu()">

        ☰

      </button>


      <div
        class="profile-dropdown"
        *ngIf="showProfileMenu">


        <!-- PROFILE -->

        <div
          class="menu-item"
          (click)="viewProfile()">

          <span class="menu-icon">
            👤
          </span>

          <span>
            View Profile
          </span>

        </div>


        <!-- MY BOOKINGS -->

        <div
          class="menu-item"
          (click)="viewMyBookings()">

          <span class="menu-icon">
            🧳
          </span>

          <span>
            My Bookings
          </span>

        </div>


        <!-- HOST DASHBOARD -->

        <div
          class="menu-item"
          (click)="becomeHost()">

          <span class="menu-icon">
            🏠
          </span>

          <span>
            Host Dashboard
          </span>

        </div>


        <div class="menu-divider"></div>


        <!-- LOGOUT -->

        <div
          class="menu-item logout-item"
          *ngIf="isLoggedIn"
          (click)="logout()">

          <span class="menu-icon">
            ↪
          </span>

          <span>
            Logout
          </span>

        </div>


        <!-- LOGIN -->

        <div
          class="menu-item"
          *ngIf="!isLoggedIn"
          (click)="login()">

          <span class="menu-icon">
            🔑
          </span>

          <span>
            Login
          </span>

        </div>


      </div>

    </div>

  </div>

</header>
